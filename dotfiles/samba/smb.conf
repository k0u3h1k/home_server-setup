[global]
   workgroup = WORKGROUP
   server string = Home Server
   netbios name = homeserver
   security = user
   map to guest = never
   server role = standalone server
   obey pam restrictions = yes
   pam password change = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

[homes]
   comment = Home Directories
   browseable = no
   read only = no
   valid users = %S

[storage]
   comment = Home Server Storage
   path = /mnt/storage
   browseable = yes
   read only = no
   create mask = 0664
   directory mask = 0775

[music]
   comment = Music Library
   path = /mnt/storage/music
   browseable = yes
   read only = no
   create mask = 0664
   directory mask = 0775

[nextcloud]
   comment = Nextcloud Files
   path = /mnt/storage/nextcloud
   browseable = yes
   read only = no
   create mask = 0664
   directory mask = 0775

[minecraft]
   comment = Minecraft World & Mods
   path = /mnt/storage/minecraft
   browseable = yes
   read only = no
   create mask = 0664
   directory mask = 0775

[backups]
   comment = Backups
   path = /mnt/storage/backups
   browseable = yes
   read only = no
   create mask = 0664
   directory mask = 0775
