apiVersion: v1
kind: PersistentVolume

metadata:
  name: navidrome-music-pv

spec:
  capacity:
    storage: {{ .Values.storage.music.size }}

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: manual

  hostPath:
    path: {{ .Values.storage.music.hostPath }}
