apiVersion: v1
kind: PersistentVolume

metadata:
  name: navidrome-data-pv

spec:
  capacity:
    storage: {{ .Values.storage.data.size }}

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: manual

  hostPath:
    path: {{ .Values.storage.data.hostPath }}
